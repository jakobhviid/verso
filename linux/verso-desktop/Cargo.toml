[package]
name = "verso-desktop"
description = "What Verso's window does on Linux, without a toolkit: sign-in, the drive's switch and settings, the library's sections, the grid's layout, imports, notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
immich-api = { path = "../../shared/immich-api" }
verso-core = { path = "../../shared/verso-core" }
verso-linux = { path = "../verso-linux" }
log = "0.4"
# The map's style and what it points to, from the hosts the Immich server's map setting names (src/map_style.rs);
# TLS comes with immich-api's default feature.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "fs", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
