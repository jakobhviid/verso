name: release

# The backup of a release made on the maintainer's machines (AGENTS.md, "Versioning"), started by hand with a tag that
# ci/release.sh tag pushed (`gh workflow run release.yml -f tag=v0.78.0`), when the workstation or the Mac is away:
# Linux's files and the draft release, as `ci/release.sh build` makes them, the Flatpak included; the Mac's disk image,
# signed, notarized and signed for Sparkle, joining the draft; and the iPhone's, the iPad's and the Apple TV's builds to
# TestFlight, only from Xcode 27 or later. The maintainer checks the draft and publishes it with `ci/release.sh publish`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, such as v0.78.0"
        required: true
      dry_run:
        description: "Build only: no draft, nothing attached, nothing uploaded"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # The tarball and the AppImage link Fedora 44's GTK and libadwaita, as the cask expects; privileged for
    # flatpak-builder's sandbox, and for podman, which runs the rpm's and the deb's containers inside this one (linux/packaging/verso-packages.sh).
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Build dependencies
        run: |
          dnf install -y -q git gcc cargo rust gtk4-devel libadwaita-devel libshumate-devel blueprint-compiler \
            python3 binutils gh flatpak flatpak-builder podman \
            gstreamer1-plugins-base gstreamer1-plugins-good glib-networking dconf adwaita-icon-theme zsync curl file \
            zstd
      - name: Podman inside this container
        # The rpm's and the deb's containers run inside this one, where podman has no cgroups to manage.
        run: |
          mkdir -p /etc/containers
          printf '[containers]\ncgroups = "disabled"\npids_limit = 0\n[engine]\ncgroup_manager = "cgroupfs"\nevents_logger = "file"\n' \
            > /etc/containers/containers.conf
      - uses: actions/checkout@v5
        with:
          # The whole history and the tags: ci/version.sh numbers the tree from them.
          fetch-depth: 0
      # The builds and the Flatpak's state between releases: only what changed since the last one is built.
      - uses: actions/cache@v4
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/verso-target
            /github/home/verso-flatpak
          key: verso-linux-${{ hashFiles('Cargo.lock', 'linux/packaging/flatpak/dev.hviid.Verso.yml') }}-${{ github.run_id }}
          restore-keys: verso-linux-
      - name: Build, and make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          VERSO_TARGET_ROOT: /github/home/verso-target
          VERSO_FLATPAK_STATE: /github/home/verso-flatpak
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ci/release.sh build "$TAG" $DRY_RUN

  macos:
    # The Mac's disk image (mac/release.sh), on the draft the linux job made. Its secrets (Settings, Secrets and
    # variables, Actions): MAC_CERTIFICATE_P12 and MAC_CERTIFICATE_PASSWORD (the Developer ID Application certificate
    # with its key, exported from Keychain Access, base64), MAC_TEAM_ID, MAC_APP_PROFILE and MAC_DRIVE_PROFILE (the
    # Developer ID profiles "Verso Provisioning Profile" and "Verso Drive Provisioning Profile", base64), ASC_KEY_P8,
    # ASC_KEY_ID and ASC_ISSUER_ID (an App Store Connect API key, for the notary service; the .p8 base64), and
    # SPARKLE_KEY_PEM (Verso's Ed25519 key for Sparkle's updates). Without them the job says so and stops.
    # Built while the linux job builds; it waits for that job's draft only to attach its files.
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run && 'yes' || '' }}
    steps:
      - name: The Mac's secrets
        id: secrets
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::notice::No Mac secrets: the release carries Linux alone."
            echo "present=no" >> "$GITHUB_OUTPUT"
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.present == 'yes'
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: The newest Xcode, and the tools
        if: steps.secrets.outputs.present == 'yes'
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          brew install xcodegen openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.secrets.outputs.present == 'yes'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.secrets.outputs.present == 'yes'
        with:
          key: mac-release
      - name: The signing keychain, the profiles and the keys
        if: steps.secrets.outputs.present == 'yes'
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APP_PROFILE_DATA: ${{ secrets.MAC_APP_PROFILE }}
          DRIVE_PROFILE_DATA: ${{ secrets.MAC_DRIVE_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_KEY_PEM: ${{ secrets.SPARKLE_KEY_PEM }}
        run: |
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$keys/certificate.p12"
          security import "$keys/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for profile in "$APP_PROFILE_DATA" "$DRIVE_PROFILE_DATA"; do
            echo "$profile" | base64 --decode > "$keys/profile.provisionprofile"
            uuid=$(security cms -D -i "$keys/profile.provisionprofile" | plutil -extract UUID raw -)
            for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$folder"
              cp "$keys/profile.provisionprofile" "$folder/$uuid.provisionprofile"
            done
          done
          echo "$ASC_KEY_P8" | base64 --decode > "$keys/notary.p8"
          printf '%s\n' "$SPARKLE_KEY_PEM" > "$keys/sparkle.pem"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: The disk image, signed and notarized
        if: steps.secrets.outputs.present == 'yes'
        env:
          TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          APP_PROFILE="Verso Provisioning Profile" EXTENSION_PROFILE="Verso Drive Provisioning Profile" \
            NOTARY_KEY="$RUNNER_TEMP/keys/notary.p8" mac/release.sh
      - name: Signed for Sparkle, and on the draft
        if: steps.secrets.outputs.present == 'yes' && env.DRY_RUN != 'yes'
        run: |
          version=${TAG#v}
          dmg="mac/build/release/verso-$version.dmg"
          # The linux job's draft, which this job was built beside: waited for, for up to an hour and a half.
          for _ in $(seq 1 180); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 30
          done
          build=$(sed -n 's/^CURRENT_PROJECT_VERSION = //p' mac/build/Version.xcconfig)
          ci/sign-mac-update.sh "$dmg" "$RUNNER_TEMP/keys/sparkle.pem" "$build"
          gh release upload "$TAG" "$dmg" "$dmg.update" --clobber
          # The macOS section covers everything since the previous Mac release, whose users skip the Linux-only ones;
          # Sparkle's update window shows it (site/build.py).
          previous=$(gh release list --limit 50 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' |
            while read -r tag; do
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '\.dmg$'; then echo "$tag"; break; fi
            done)
          notes=$(ci/release-notes.sh ${previous:+"$previous"} "$TAG")
          body=$(gh release view "$TAG" --json body --jq .body)
          title=$(gh release view "$TAG" --json name --jq .name | sed 's/ (Linux)$/ (Linux and macOS)/')
          printf '## macOS\n\n`verso-%s.dmg`, for macOS 15 or later, signed and notarized; Verso offers it in Check for Updates…, or `brew upgrade --cask verso`.\n\n%s\n\n## Linux\n\n%s\n' \
            "$version" "$notes" "$body" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
      - name: The keychain and the keys removed
        if: always() && steps.secrets.outputs.present == 'yes'
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys"

  ios:
    # Verso for the iPhone and the iPad, and for the Apple TV (ios/release.sh, --tvos), uploaded to App Store Connect
    # for TestFlight: never on GitHub (AGENTS.md, "Versioning"). Its secrets: IOS_CERTIFICATE_P12 and
    # IOS_CERTIFICATE_PASSWORD (the Apple Distribution certificate with its key, base64), MAC_TEAM_ID, the App Store
    # profiles IOS_APP_PROFILE, IOS_DRIVE_PROFILE, IOS_MESSAGES_PROFILE, IOS_WIDGETS_PROFILE, TV_APP_PROFILE and
    # TV_TOP_SHELF_PROFILE (base64),
    # and the API key the Mac job notarizes with (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID). Without them the job says so
    # and stops. A rehearsal by hand builds both and uploads nothing.
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run && 'yes' || '' }}
    steps:
      - name: The iPhone's secrets
        id: secrets
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12 }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::notice::No iOS secrets: nothing goes to TestFlight."
            echo "present=no" >> "$GITHUB_OUTPUT"
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.present == 'yes'
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: The newest Xcode, and the tools
        if: steps.secrets.outputs.present == 'yes'
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"
          brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
        if: steps.secrets.outputs.present == 'yes'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        if: steps.secrets.outputs.present == 'yes'
        with:
          key: ios-release
      - name: The nightly toolchain, for the Apple TV's core (mac/build-rust.sh --tvos)
        if: steps.secrets.outputs.present == 'yes'
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: The signing keychain, the profiles and the key
        if: steps.secrets.outputs.present == 'yes'
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE_DATA: ${{ secrets.IOS_APP_PROFILE }}
          DRIVE_PROFILE_DATA: ${{ secrets.IOS_DRIVE_PROFILE }}
          MESSAGES_PROFILE_DATA: ${{ secrets.IOS_MESSAGES_PROFILE }}
          WIDGETS_PROFILE_DATA: ${{ secrets.IOS_WIDGETS_PROFILE }}
          TV_PROFILE_DATA: ${{ secrets.TV_APP_PROFILE }}
          TV_TOP_SHELF_PROFILE_DATA: ${{ secrets.TV_TOP_SHELF_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$keys/certificate.p12"
          security import "$keys/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for profile in "$APP_PROFILE_DATA" "$DRIVE_PROFILE_DATA" "$MESSAGES_PROFILE_DATA" "$WIDGETS_PROFILE_DATA" "$TV_PROFILE_DATA" \
              "$TV_TOP_SHELF_PROFILE_DATA"; do
            echo "$profile" | base64 --decode > "$keys/profile.mobileprovision"
            uuid=$(security cms -D -i "$keys/profile.mobileprovision" | plutil -extract UUID raw -)
            for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$folder"
              cp "$keys/profile.mobileprovision" "$folder/$uuid.mobileprovision"
            done
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: The iPhone and the iPad, and the Apple TV, to TestFlight
        if: steps.secrets.outputs.present == 'yes'
        env:
          TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          upload=$([ "$DRY_RUN" = yes ] && echo --no-upload || true)
          # The App Store asks for the iOS 27 SDK from April 2027, and a build made with an older one runs on iOS 27 in
          # its compatibility mode: from an older Xcode, the runner builds and uploads nothing.
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 27 ]; then
            echo "::notice::Xcode $major on this runner: built, not uploaded to TestFlight (Xcode 27 or later uploads)."
            upload=--no-upload
          fi
          ios/release.sh $upload
          VERSO_BRIDGE_BUILT=1 ios/release.sh --tvos $upload
      - name: The keychain and the keys removed
        if: always() && steps.secrets.outputs.present == 'yes'
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys" "$HOME/.appstoreconnect/private_keys"
