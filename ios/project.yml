# Verso on iPhone and iPad (ROADMAP.md, "M10. Verso on iOS"), on the Mac's Swift and the same bridge. `xcodegen` here
# writes Verso.xcodeproj from this file after `mac/build-rust.sh debug --ios` has built the bridge with its iOS slices
# into mac/build/; neither result is committed.
name: Verso
options:
  bundleIdPrefix: dev.hviid
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    # iPhone and iPad, and neither on the Mac, which has its own app.
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    # The bridge has the Simulator's slice for Apple silicon alone (mac/build-rust.sh), the only Macs that build Verso
    # for iOS, so the Simulator's build leaves Intel out.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    # The app's identity, as on the Mac (mac/Verso/project.yml), which the Info.plist and entitlements read: its bundle
    # identifier, name, App Group and URL schemes. A Debug build is Verso Dev, with an identity of its own, so it
    # installs, signs in and keeps its settings beside a release. An App Group on iOS is `group.` and a name
    # registered with the team, where the Mac's is the team's prefix and the bundle identifier.
    VERSO_IDENTITY: dev.hviid.Verso
    IMMICH_APP_NAME: Verso
    VERSO_APP_GROUP: group.dev.hviid.Verso
    IMMICH_URL_SCHEME: verso
    APP_ICON: AppIcon
    MESSAGES_ICON: MessagesIcon
  configs:
    Debug:
      VERSO_IDENTITY: dev.hviid.Verso.Dev
      IMMICH_APP_NAME: Verso Dev
      VERSO_APP_GROUP: group.dev.hviid.Verso.Dev
      IMMICH_URL_SCHEME: verso-dev
      APP_ICON: AppIconDev

targets:
  # The bridge's generated Swift bindings with Verso's wrapper, as on the Mac: a module of its own, so the bindings'
  # `Credential` and `Item` do not meet the app's types of the same names. mac/Shared comes with them, for Verso
  # Drive's account and settings (DriveCore).
  VersoCore:
    type: library.static
    platform: iOS
    sources:
      - ../mac/Verso/VersoCore
      - ../mac/build/Generated
      - ../mac/Shared
    settings:
      base:
        PRODUCT_NAME: VersoCore
        # uniffi writes its bindings for Swift 5's checking.
        SWIFT_VERSION: "5.0"
    dependencies:
      - framework: ../mac/build/VersoBridge.xcframework
        embed: false

  Verso:
    type: application
    platform: iOS
    sources:
      # The iOS app's own views.
      - Verso
      # What backing up's Live Activity shows, which the widget extension draws.
      - Widgets/BackupActivityAttributes.swift
      # The Mac app's Swift that has no AppKit, where it is: the API layer, the core's transport, and the models and
      # support files the iOS views use, with what those use in turn.
      - ../mac/Verso/Verso/API
      - ../mac/Verso/Verso/Core
      - ../mac/Verso/Verso/App/AccountOperation.swift
      - ../mac/Verso/Verso/App/AccountPermissions.swift
      - ../mac/Verso/Verso/App/AdminModel.swift
      - ../mac/Verso/Verso/App/AlbumOrders.swift
      - ../mac/Verso/Verso/App/AlbumsOptions.swift
      - ../mac/Verso/Verso/App/AppIconDesign.swift
      - ../mac/Verso/Verso/App/AssetInspectorState.swift
      - ../mac/Verso/Verso/App/AssetsStackMutation.swift
      - ../mac/Verso/Verso/App/DuplicatesSortBy.swift
      - ../mac/Verso/Verso/App/ExploreFolders.swift
      - ../mac/Verso/Verso/App/ExploreMapFit.swift
      - ../mac/Verso/Verso/App/LibraryMode.swift
      - ../mac/Verso/Verso/App/PeopleShow.swift
      - ../mac/Verso/Verso/App/PlacesOptions.swift
      - ../mac/Verso/Verso/App/SearchHistory.swift
      - ../mac/Verso/Verso/App/SharedLinksFilter.swift
      - ../mac/Verso/Verso/App/SharingReach.swift
      - ../mac/Verso/Verso/App/SidebarLayout.swift
      - ../mac/Verso/Verso/App/SimilarPhotosAnalyzer.swift
      - ../mac/Verso/Verso/App/SimilarPhotosModel.swift
      - ../mac/Verso/Verso/App/SimilarPhotos.swift
      - ../mac/Verso/Verso/App/ViewerMotionLayout.swift
      # The photo grids' arithmetic both apps lay out and pinch by: a row's tiles, and the way between two zoom levels.
      - ../mac/Verso/Verso/App/GridTileMetrics.swift
      - ../mac/Verso/Verso/App/GridZoomTransition.swift
      - ../mac/Verso/Verso/App/AccountVault.swift
      - ../mac/Verso/Verso/App/AlbumPreviews.swift
      - ../mac/Verso/Verso/App/AlbumsActions.swift
      - ../mac/Verso/Verso/App/AppModel.swift
      - ../mac/Verso/Verso/App/AssetGridModel.swift
      - ../mac/Verso/Verso/App/GridArrangement.swift
      - ../mac/Verso/Verso/App/LockedFolderMedia.swift
      - ../mac/Verso/Verso/App/MetadataState.swift
      - ../mac/Verso/Verso/App/NotificationCount.swift
      - ../mac/Verso/Verso/App/PlaceVisits.swift
      - ../mac/Verso/Verso/App/SharingModel.swift
      - ../mac/Verso/Verso/App/UploadQueue.swift
      - ../mac/Verso/Verso/App/VersoNotifications.swift
      - ../mac/Verso/Verso/App/VersoDrive.swift
      - ../mac/Verso/Verso/Support/AccountStore.swift
      - ../mac/Verso/Verso/Support/Formatters.swift
      - ../mac/Verso/Verso/Support/ImagePipeline.swift
      - ../mac/Verso/Verso/Support/LiveMotions.swift
      - ../mac/Verso/Verso/Support/ThumbHash.swift
      # Videos from a server whose own certificate is trusted, through the app's session (ServerTrust).
      - ../mac/Verso/Verso/Support/VideoStream.swift
      # A photo dragged out of a grid as its original, downloaded once another app takes it, and the mark that keeps
      # the app's own drops from importing it again.
      - ../mac/Verso/Verso/Views/MacIntegration/OriginalTransfer.swift
      - ../mac/Verso/Verso/Views/Albums/AlbumAssetTransfer.swift
      # The Mac's Icon Composer documents, which are documents rather than folders of resources: the release's
      # white paper and Verso Dev's blue.
      - path: ../mac/Verso/Verso/AppIcon.icon
        type: file
        buildPhase: resources
      - path: ../mac/Verso/Verso/AppIconDev.icon
        type: file
        buildPhase: resources
      - path: ../THIRD-PARTY-NOTICES.md
        buildPhase: resources
      # The privacy manifest the App Store asks of each bundle (ARCHITECTURE.md, "Privacy manifests").
      - path: Config/Privacy/Verso/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERSO_IDENTITY)
        PRODUCT_NAME: $(IMMICH_APP_NAME)
        PRODUCT_MODULE_NAME: Verso
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Verso.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON)
        # The app icon's 13 other designs and lenses as alternate icons, each its Day look with its Night look as the
        # dark appearance (Verso/Assets.xcassets, AppIcon-Sand and AppIcon-SandGraphite, or AppIconDev-Sand in Verso
        # Dev), which the Info.plist then lists under CFBundleAlternateIcons and App Icon in the account's sheet sets
        # (AccountAppIconPage.swift). Only the sets named are compiled, so a release carries none of Verso Dev's.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: $(APP_ICON)-MistGraphite $(APP_ICON)-Sand $(APP_ICON)-SandGraphite $(APP_ICON)-Dark $(APP_ICON)-DarkGraphite $(APP_ICON)-Paper $(APP_ICON)-PaperGraphite $(APP_ICON)-Frame $(APP_ICON)-FrameGraphite $(APP_ICON)-Slate $(APP_ICON)-SlateGraphite $(APP_ICON)-Sky $(APP_ICON)-SkyGraphite
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: VersoCore
      - target: VersoDrive
        embed: true
      - target: VersoMessages
        embed: true
      - target: VersoWidgets
        embed: true
      - framework: ../mac/build/VersoBridge.xcframework
        embed: false
      - sdk: Security.framework

  # Verso Drive in the Files app: the Mac's File Provider extension and what it shares with the app, over the same
  # bridge (ARCHITECTURE.md, "Verso Drive on the Mac"). Finder's actions (Actions.swift) are the Mac's alone.
  VersoDrive:
    type: app-extension
    platform: iOS
    sources:
      - path: ../mac/FileProvider
        excludes: [Actions.swift]
      - ../mac/Shared
      - ../mac/build/Generated
      - path: Config/Privacy/VersoDrive/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERSO_IDENTITY).Drive
        # The same in both configurations, as on the Mac: the app embeds the extension by this name.
        PRODUCT_NAME: VersoDrive
        INFOPLIST_FILE: Config/VersoDrive-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/VersoDrive.entitlements
        # Written for Swift 5's checking, as on the Mac.
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
    dependencies:
      - framework: ../mac/build/VersoBridge.xcframework
        embed: false
      - sdk: Security.framework

  # Verso in Messages' row of apps (ios/Messages): the library's photos to send into a conversation, with the app's
  # account, which it reads from the Keychain group the app shares with its extensions (AccountVault). It calls Immich
  # through the API layer's own URLSession, without the bridge, which keeps it small: an extension has a fraction of an
  # app's memory. Its icon is a sticker icon set of its own (Messages/Assets.xcassets), the release's or Verso Dev's.
  VersoMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
      - ../mac/Verso/Verso/API
      - ../mac/Verso/Verso/App/AccountVault.swift
      - ../mac/Verso/Verso/Support/AccountStore.swift
      - ../mac/Verso/Verso/Support/ThumbHash.swift
      - path: Config/Privacy/VersoMessages/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERSO_IDENTITY).Messages
        # The same in both configurations, as the drive's: the app embeds the extension by this name.
        PRODUCT_NAME: VersoMessages
        INFOPLIST_FILE: Config/VersoMessages-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/VersoMessages.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: $(MESSAGES_ICON)
        SKIP_INSTALL: YES

  # Verso's widget extension (ios/Widgets): backing up's Live Activity on the Lock Screen and in the Dynamic Island,
  # which the app starts and updates (BackupLiveActivity); it draws the words the app writes, and needs no account.
  VersoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERSO_IDENTITY).Widgets
        # The same in both configurations, as the other extensions: the app embeds it by this name.
        PRODUCT_NAME: VersoWidgets
        INFOPLIST_FILE: Config/VersoWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Logic tests that need no server and no app (ios/VersoTests): backing up's store and its recovery, the state of a
  # photo and its parts, how upload answers are recorded, Not in Immich's groups, the first run's tally and the
  # another-form match; what is on its way (which photos are new, the tiles' marks) and where the Library places it;
  # which server addresses sign-in may try over plain http; and the certificate trusted for a server, by its fingerprint.
  # The sources they test are compiled in, as they use nothing else of the app.
  VersoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VersoTests
      - Verso/Backup/BackupDatabase.swift
      - Verso/Backup/BackupModel.swift
      - Verso/Backup/BackupOnItsWay.swift
      - Verso/Backup/BackupStore.swift
      - Verso/Backup/BackupTransport.swift
      - Verso/Grid/TimelinePhoneMerge.swift
      - ../mac/Verso/Verso/API/ServerAddress.swift
      - ../mac/Verso/Verso/API/ServerTrust.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERSO_IDENTITY).Tests
        GENERATE_INFOPLIST_FILE: YES

  # A walk through the app keeping a screenshot of each place, on a Simulator (ios/VersoUITests/TourTests.swift).
  # Backing up's walk puts a photo into the Simulator's library and takes it out again (OnItsWayWalkTests), which asks.
  VersoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VersoUITests
    dependencies:
      - target: Verso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VERSO_IDENTITY).UITests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "The walk puts a photo into the library and takes it out after."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "The walk puts a photo into the library."

schemes:
  Verso:
    build:
      targets:
        Verso: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VersoTests
        - VersoUITests
    archive:
      config: Release
